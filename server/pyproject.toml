[tool.poetry]
name = "doc-assistant-server"
version = "1.0.0"
description = "FastAPI backend for the RAG document assistant"
package-mode = false  # this is an application, not a library (needs Poetry >= 1.8)

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
httpx = ">=0.27"
google-genai = ">=2.3.0"
pydantic-settings = ">=2.4"
python-multipart = ">=0.0.9"
numpy = ">=1.26"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"
